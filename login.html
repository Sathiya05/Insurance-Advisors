<script>
(function(){
function themeIcon(dark){
if(dark) return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
var themeBtns=Array.prototype.slice.call(document.querySelectorAll("[data-login-theme]"));
var rtlBtns=Array.prototype.slice.call(document.querySelectorAll("[data-login-rtl]"));
function paint(){var dark=document.documentElement.classList.contains("dark");themeBtns.forEach(function(b){b.innerHTML=themeIcon(dark);});}
paint();
themeBtns.forEach(function(b){b.addEventListener("click",function(){
var isDark=document.documentElement.classList.toggle("dark");
try{localStorage.setItem("site-theme",isDark?"dark":"light");}catch(e){}
paint();
});});
rtlBtns.forEach(function(b){b.addEventListener("click",function(){
var toRtl=document.documentElement.dir!=="rtl";
document.documentElement.dir=toRtl?"rtl":"ltr";
try{localStorage.setItem("site-direction",toRtl?"rtl":"ltr");}catch(e){}
});});
var menuBtn=document.getElementById("login-menu-btn"),panel=document.getElementById("login-menu-panel");
if(menuBtn&&panel){
menuBtn.addEventListener("click",function(){
var open=panel.classList.toggle("hidden")===false;
panel.classList.toggle("flex",open);
menuBtn.setAttribute("aria-expanded",open?"true":"false");
});
document.addEventListener("click",function(e){
if(panel.classList.contains("hidden"))return;
if(panel.contains(e.target)||menuBtn.contains(e.target))return;
panel.classList.add("hidden");panel.classList.remove("flex");menuBtn.setAttribute("aria-expanded","false");
});
document.addEventListener("keydown",function(e){
if(e.key!=="Escape")return;
panel.classList.add("hidden");panel.classList.remove("flex");menuBtn.setAttribute("aria-expanded","false");
});
}
})();
</script>
